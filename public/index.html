<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Something For You ❤️</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <div id="hearts"></div>
    <div class="stars"></div>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="home">

        <div class="eyebrow">
            ✦ A LITTLE SOMETHING FOR YOU ✦
        </div>

        <h1>
            I made this
            <span>just for you.</span>
        </h1>

        <p class="intro">
            Some feelings are too beautiful
            to fit inside an ordinary message.
        </p>

        <p class="intro muted">
            So I decided to create a little journey instead...
        </p>

        <div class="gift-area">

            <div class="gift-glow"></div>

            <div class="gift" id="gift">

                <div class="gift-bow">
                    <span></span>
                    <span></span>
                </div>

                <div class="gift-lid"></div>

                <div class="gift-box">

                    <div class="ribbon vertical"></div>
                    <div class="ribbon horizontal"></div>

                </div>

            </div>

            <p class="gift-hint">
                Tap the gift ❤️
            </p>

        </div>

        <div class="bottom-note">
            Take your time · There's no rush
        </div>

    </main>


    <div class="opening-screen" id="openingScreen">

        <div class="opening-content">

            <div class="big-heart">♡</div>

            <h2>Welcome...</h2>

            <p>
                I'm really glad you opened this.
            </p>

        </div>

    </div>


    <script src="js/global.js"></script>
    <script src="js/home.js"></script>

</body>
</html>
