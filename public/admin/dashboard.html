<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Love Dashboard</title>

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="admin.css">

<style>

.dashboard {

    min-height: 100vh;

    padding: 50px 25px;

    position: relative;

    z-index: 2;

}

.dashboard-container {

    max-width: 1100px;

    margin: auto;

}

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 40px;

}

.header h1 {

    font-size: 55px;

    font-weight: 400;

}

.logout {

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.1);

    color: white;

    padding: 12px 20px;

    border-radius: 30px;

}

.response {

    padding: 30px;

    border-radius: 20px;

    margin-bottom: 20px;

}

.answer {

    font-size: 20px;

    color: var(--pink);

}

.message {

    margin-top: 15px;

    color: #d2c0c7;

    line-height: 1.7;

}

.date {

    margin-top: 15px;

    color: #77636b;

    font-size: 12px;

}

</style>

</head>


<body>

<div id="hearts"></div>

<div class="stars"></div>


<main class="dashboard">

<div class="dashboard-container">

<div class="header">

<h1>
Love Dashboard ❤️
</h1>

<button
class="logout"
id="logout">

Logout

</button>

</div>


<div id="responses">

Loading...

</div>

</div>

</main>


<script type="module"
src="admin.js"></script>

</body>

</html>
