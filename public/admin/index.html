<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Love Proposal — Admin</title>

    <link
        rel="stylesheet"
        href="/admin/admin.css"
    >

</head>

<body>

<div class="background"></div>

<header class="topbar">

    <div>
        <h1>❤️ Love Proposal</h1>
        <p>Private Response Dashboard</p>
    </div>

    <button id="refreshButton">
        ↻ Refresh
    </button>

</header>


<main class="dashboard">

    <section class="stats">

        <div class="stat-card">

            <span>💌</span>

            <div>
                <small>Total Responses</small>
                <h2 id="totalResponses">0</h2>
            </div>

        </div>


        <div class="stat-card">

            <span>❤️</span>

            <div>
                <small>Yes Responses</small>
                <h2 id="yesResponses">0</h2>
            </div>

        </div>


        <div class="stat-card">

            <span>💬</span>

            <div>
                <small>Messages</small>
                <h2 id="messageCount">0</h2>
            </div>

        </div>

    </section>


    <section class="latest">

        <div class="section-title">

            <div>
                <span>✨ Latest Response</span>
                <h2 id="latestAnswer">
                    Waiting for response...
                </h2>
            </div>

            <div id="latestDate"></div>

        </div>

        <div class="latest-message">

            <p id="latestMessage">
                No message yet.
            </p>

        </div>

    </section>


    <section>

        <div class="section-heading">

            <h2>All Responses</h2>

            <span id="responseStatus">
                Loading...
            </span>

        </div>

        <div id="responsesContainer">

        </div>

    </section>

</main>

<script
    src="/admin/admin.js"
></script>

</body>
</html>
