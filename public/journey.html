<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>A Few Questions ❤️</title>

<link rel="stylesheet"
href="css/global.css">

<link rel="stylesheet"
href="css/journey.css">

</head>

<body>

<div id="hearts"></div>

<div class="stars"></div>

<div class="background-glow glow-one"></div>

<main class="journey">

    <div class="progress">
        <span id="progressText">01 / 04</span>
    </div>

    <div class="question-card glass"
         id="questionCard">

        <div class="question-number"
             id="questionNumber">

            QUESTION 01

        </div>

        <h1 id="question">

            Do you believe some people
            enter our lives at exactly
            the right moment?

        </h1>

        <div class="answers"
             id="answers">

            <button class="answer"
                    data-answer="Yes">

                Yes ❤️

            </button>

            <button class="answer"
                    data-answer="Maybe">

                Maybe ✨

            </button>

        </div>

        <p class="question-note">

            There are no wrong answers.

        </p>

    </div>

</main>

<script src="js/global.js"></script>
<script src="js/journey.js"></script>

</body>
</html>
